<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle Navigation Grid Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
  </g>

  <!-- Glowing Radar Pulse Ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="256" cy="220" r="90" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.35"/>

  <!-- Dynamic Precision Wayfinding Route Line -->
  <path d="M140 370 L210 300 L300 300 L370 220" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#nodeGlow)"/>

  <!-- Starting Node Beacon -->
  <circle cx="140" cy="370" r="14" fill="#090d16" stroke="#3b82f6" stroke-width="6"/>

  <!-- Intermediate Waypoint Turn Node -->
  <circle cx="210" cy="300" r="10" fill="#090d16" stroke="#6366f1" stroke-width="5"/>
  <circle cx="300" cy="300" r="10" fill="#090d16" stroke="#6366f1" stroke-width="5"/>

  <!-- Destination Beacon Pin -->
  <g transform="translate(370, 220)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="32" fill="url(#primaryGrad)" opacity="0.25"/>
    <circle cx="0" cy="0" r="22" fill="url(#primaryGrad)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>
</svg>
