<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
<title>LOCOROM • Campus Indoor Navigation</title>
<meta name="description" content="Enterprise indoor visual wayfinding and corridor walkthrough system for MITM campus.">
<link rel="icon" type="image/svg+xml" href="logo.svg">

<!-- Inter & JetBrains Mono Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* --------------------------------------------------------------------------
   MNC ENTERPRISE DESIGN SYSTEM (Google / Apple / Linear / Uber Inspired)
   -------------------------------------------------------------------------- */
:root {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Dark Theme Tokens (Default) */
  --bg-app: #090a0f;
  --bg-sidebar: #0f1118;
  --bg-surface: #141722;
  --bg-elevated: #1a1e2d;
  --bg-input: #121520;
  --bg-hover: #1f2436;
  --bg-active: #252b40;
  --bg-canvas: #020408;

  --border-subtle: rgba(255, 255, 255, 0.05);
  --border: rgba(255, 255, 255, 0.09);
  --border-focus: #3b82f6;

  --text-main: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-inverse: #090a0f;

  --accent-blue: #3b82f6;
  --accent-cyan: #06b6d4;
  --accent-indigo: #6366f1;
  --accent-emerald: #10b981;
  --accent-amber: #f59e0b;

  --sidebar-width: 400px;
  --header-height: 52px;

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 9999px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.7);

  --transition: 160ms cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="light"] {
  --bg-app: #f8fafc;
  --bg-sidebar: #ffffff;
  --bg-surface: #ffffff;
  --bg-elevated: #f1f5f9;
  --bg-input: #f1f5f9;
  --bg-hover: #e2e8f0;
  --bg-active: #cbd5e1;
  --bg-canvas: #0f172a;

  --border-subtle: rgba(0, 0, 0, 0.04);
  --border: rgba(0, 0, 0, 0.09);
  --border-focus: #2563eb;

  --text-main: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --text-inverse: #ffffff;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.08);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  background-color: var(--bg-app);
  color: var(--text-main);
  line-height: 1.45;
  user-select: none;
}

/* --------------------------------------------------------------------------
   App Shell Layout (Full Viewport)
   -------------------------------------------------------------------------- */
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Top App Bar */
header.app-bar {
  height: var(--header-height);
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  flex-shrink: 0;
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.brand-icon {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-title {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-tag {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: var(--radius-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.app-bar-center {
  display: flex;
  align-items: center;
  gap: 6px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: var(--radius-pill);
}

.radar-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-emerald);
  box-shadow: 0 0 6px var(--accent-emerald);
}

.app-bar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tool-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  height: 32px;
  width: 32px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition);
}

.tool-btn:hover {
  background: var(--bg-hover);
  color: var(--text-main);
  border-color: var(--border);
}

/* Main Workspace */
.workspace {
  flex: 1;
  display: flex;
  height: calc(100vh - var(--header-height));
  width: 100vw;
  overflow: hidden;
  position: relative;
}

/* --------------------------------------------------------------------------
   Left Command & Route Sidebar
   -------------------------------------------------------------------------- */
aside.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100%;
  flex-shrink: 0;
  z-index: 50;
  overflow: hidden;
  transition: transform var(--transition);
}

/* Search Header */
.sidebar-search-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-sidebar);
}

.command-input-wrap {
  display: flex;
  align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  transition: all var(--transition);
}

.command-input-wrap:focus-within {
  border-color: var(--border-focus);
  background: var(--bg-surface);
  box-shadow: 0 0 0 1px var(--border-focus);
}

.command-input-wrap svg {
  color: var(--text-muted);
  flex-shrink: 0;
  margin-right: 10px;
}

.command-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-sans);
  font-size: 13.5px;
  color: var(--text-main);
}

.command-input::placeholder {
  color: var(--text-muted);
}

.kbd-shortcut {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  padding: 1px 5px;
  border-radius: var(--radius-xs);
}

.clear-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  display: none;
  padding: 2px;
}

.clear-btn:hover {
  color: var(--text-main);
}

/* Filter Strip */
.filter-strip {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 10px 14px 6px 14px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.filter-strip::-webkit-scrollbar {
  display: none;
}

.filter-tab {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
}

.filter-tab:hover {
  background: var(--bg-hover);
  color: var(--text-main);
}

.filter-tab.active {
  background: var(--text-main);
  color: var(--text-inverse);
  border-color: var(--text-main);
  font-weight: 600;
}

/* Sidebar Scrollable Body */
.sidebar-body {
  flex: 1;
  overflow-y: auto;
  position: relative;
}

/* Mode 1: Directory List View */
.directory-view {
  padding: 8px 10px;
}

.dest-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 2px;
}

.dest-item:hover {
  background: var(--bg-hover);
  border-color: var(--border-subtle);
}

.dest-item.active {
  background: var(--bg-active);
  border-color: var(--border-focus);
}

.dest-info-left {
  display: flex;
  align-items: center;
  gap: 12px;
  overflow: hidden;
}

.dest-icon-box {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-xs);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-blue);
  flex-shrink: 0;
}

.dest-texts {
  overflow: hidden;
}

.dest-name {
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dest-meta {
  font-size: 11.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dest-floor-badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  padding: 2px 7px;
  border-radius: var(--radius-xs);
  flex-shrink: 0;
}

/* Mode 2: Route Detail Panel (Slide-in) */
.route-panel {
  display: none;
  padding: 14px;
}

.route-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.back-link:hover {
  color: var(--text-main);
}

.close-route-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
}

.close-route-btn:hover {
  color: var(--text-main);
}

.route-dest-header {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 14px;
}

.route-dest-title {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-main);
}

.route-dest-dept {
  font-size: 12px;
  color: var(--accent-cyan);
  margin-top: 2px;
}

.route-tags {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.mini-badge {
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: var(--radius-xs);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
}

/* Starting Point Segmented Tab Switcher */
.ap-block {
  margin-bottom: 14px;
}

.ap-header-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.ap-segmented-tabs {
  display: flex;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  padding: 3px;
  border-radius: var(--radius-sm);
  gap: 3px;
}

.ap-seg-tab {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 8px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  transition: all var(--transition);
}

.ap-seg-tab:hover {
  color: var(--text-main);
}

.ap-seg-tab.active {
  background: var(--bg-surface);
  color: var(--text-main);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

/* Turn-by-Turn Directions Card */
.route-nav-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 14px;
}

.nav-card-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-blue);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.nav-card-text {
  font-size: 13px;
  color: var(--text-main);
  line-height: 1.5;
  white-space: pre-wrap;
}

/* Waypoint Step Timeline Checklist */
.step-checklist-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin: 14px 0 8px 0;
}

.step-checklist {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.step-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-size: 12.5px;
  color: var(--text-secondary);
  transition: all var(--transition);
  border: 1px solid transparent;
}

.step-row:hover {
  background: var(--bg-hover);
  color: var(--text-main);
}

.step-row.active {
  background: var(--bg-active);
  color: var(--text-main);
  border-color: var(--border-focus);
}

.step-num-circle {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.step-row.active .step-num-circle {
  background: var(--accent-blue);
  border-color: var(--accent-blue);
  color: #ffffff;
}

/* Route Action Buttons */
.route-actions-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.btn-route {
  flex: 1;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 500;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: all var(--transition);
}

.btn-route:hover {
  background: var(--bg-hover);
}

/* --------------------------------------------------------------------------
   Right Main Viewport Canvas (Visual Corridor Stage)
   -------------------------------------------------------------------------- */
main.viewport-canvas {
  flex: 1;
  background: var(--bg-canvas);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Image Display Layer */
.media-stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.media-stage img,
.media-stage video {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
}

/* Floating Top HUD Capsule */
.hud-top-capsule {
  position: absolute;
  top: 16px;
  left: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
  z-index: 40;
}

.hud-location-badge {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(15, 17, 24, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-md);
}

.hud-room {
  font-family: var(--font-mono);
  font-size: 13.5px;
  font-weight: 700;
  color: #ffffff;
}

.hud-divider {
  width: 1px;
  height: 12px;
  background: var(--border);
}

.hud-step-counter {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent-cyan);
}

.hud-right-actions {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background: rgba(15, 17, 24, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-md);
}

.hud-btn:hover {
  background: rgba(30, 35, 50, 0.95);
  transform: scale(1.05);
}

/* Large Center Left/Right Arrow Paddles */
.nav-paddle {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  background: rgba(15, 17, 24, 0.7);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition);
  z-index: 40;
}

.nav-paddle:hover {
  background: rgba(59, 130, 246, 0.9);
  border-color: transparent;
  transform: translateY(-50%) scale(1.08);
}

.nav-paddle.left { left: 20px; }
.nav-paddle.right { right: 20px; }

/* Floating Bottom Navigation Deck (Tesla / Apple Maps Deck) */
.hud-deck {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 680px;
  background: rgba(15, 17, 24, 0.88);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  box-shadow: var(--shadow-lg);
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.deck-controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.deck-btn-prev, .deck-btn-next {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: #ffffff;
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 16px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all var(--transition);
}

.deck-btn-prev:hover, .deck-btn-next:hover {
  background: var(--bg-hover);
  border-color: var(--accent-blue);
}

.deck-btn-tour {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all var(--transition);
}

.deck-btn-tour:hover {
  color: #ffffff;
  border-color: var(--text-muted);
}

.deck-btn-tour.playing {
  background: var(--accent-blue);
  color: #ffffff;
  border-color: transparent;
}

/* Timeline Step Scrubber Bar */
.deck-timeline-track {
  display: flex;
  gap: 4px;
  width: 100%;
  padding-top: 2px;
}

.timeline-segment {
  flex: 1;
  height: 5px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: var(--radius-pill);
  cursor: pointer;
  transition: all var(--transition);
}

.timeline-segment:hover {
  background: rgba(255, 255, 255, 0.4);
}

.timeline-segment.active {
  background: var(--accent-cyan);
  box-shadow: 0 0 8px var(--accent-cyan);
}

.timeline-segment.past {
  background: var(--accent-blue);
}

/* Toast Floating Shelf */
.toast-host {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
  pointer-events: none;
}

.toast-pill {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-size: 12.5px;
  font-weight: 500;
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
  animation: slideUp 180ms ease forwards;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mobile Responsiveness */
@media (max-width: 840px) {
  .workspace {
    flex-direction: column-reverse;

  aside.sidebar {

  .hud-deck {
    bottom: 10px;
    width: 95%;
    padding: 8px 12px;
  }
  .nav-paddle {
    display: none;
  }
}

<script>
/**
 * LOCOROM Enterprise Navigation Engine
 */
const GITHUB_RAW = "https://raw.githubusercontent.com/aryamanm77/mitm-room/main/";

// State
let allRooms = {};
let currentRoomKey = null;
let currentApIndex = 0;
let currentPhotos = [];
let currentPhotoIndex = 0;
let activeFloor = "all";
let isAutoPilot = false;
let autoPilotTimer = null;
const preloadedUrls = new Set();

function resolveUrl(path) {
  if (!path) return "";
  if (path.startsWith("http://") || path.startsWith("https://")) return path;
  if (window.location.protocol === "https:" && !window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1")) {
    return GITHUB_RAW + path;
  }
  return path;
}

function showToast(msg) {
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast-pill";
  el.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity 200ms ease";
    setTimeout(() => el.remove(), 200);
  }, 2200);
}

// App Initialization
async function initApp() {
  setupTheme();
  setupEventHandlers();

  if (window.LOCOROM_DATA && Object.keys(window.LOCOROM_DATA).length > 0) {
    allRooms = window.LOCOROM_DATA;
    onDataReady();
  } else {
    try {
      const res = await fetch("rooms_data.json");
      allRooms = await res.json();
      onDataReady();
    } catch (e) {
      console.warn("Could not load local rooms data:", e);
    }
  }
}

function onDataReady() {
  const total = Object.keys(allRooms).length;
  document.getElementById("destCountDisplay").textContent = `${total} Destinations`;
  renderDirectoryList();

  // URL Deep link or default selection
  const params = new URLSearchParams(window.location.search);
  const targetRoom = params.get("room") || window.location.hash.replace("#", "") || "205";
  if (allRooms[targetRoom]) {
    selectRoom(targetRoom, false);
  } else {
    const firstKey = Object.keys(allRooms)[0];
    if (firstKey) selectRoom(firstKey, false);
  }
}

// Theme System
function setupTheme() {
  const saved = localStorage.getItem("locorom_theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  updateThemeIcon(saved);

  document.getElementById("themeBtn").addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme") || "dark";
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("locorom_theme", next);
    updateThemeIcon(next);
  });
}

function updateThemeIcon(t) {
  const icon = document.getElementById("themeIcon");
  if (t === "light") {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  } else {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}

// Event Listeners
function setupEventHandlers() {
  const searchInput = document.getElementById("searchInput");
  const clearBtn = document.getElementById("clearBtn");

  searchInput.addEventListener("input", () => {
    clearBtn.style.display = searchInput.value ? "block" : "none";
    showDirectoryMode();
    renderDirectoryList();
  });

  clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    clearBtn.style.display = "none";
    searchInput.focus();
    renderDirectoryList();
  });

  // Category filter tabs
  document.querySelectorAll(".filter-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      activeFloor = tab.getAttribute("data-floor");
      showDirectoryMode();
      renderDirectoryList();
    });
  });

  // Navigation Paddles & Deck buttons
  document.getElementById("paddlePrev").addEventListener("click", prevPhoto);
  document.getElementById("paddleNext").addEventListener("click", nextPhoto);
  document.getElementById("deckPrev").addEventListener("click", prevPhoto);
  document.getElementById("deckNext").addEventListener("click", nextPhoto);
  document.getElementById("deckTourBtn").addEventListener("click", toggleAutoPilot);

  // Fullscreen
  document.getElementById("hudFsBtn").addEventListener("click", toggleFullscreen);

  // Back / Close Route
  document.getElementById("routeBackBtn").addEventListener("click", showDirectoryMode);
  document.getElementById("routeCloseBtn").addEventListener("click", showDirectoryMode);
  document.getElementById("brandBtn").addEventListener("click", showDirectoryMode);

  // Copy & Share
  document.getElementById("copyRouteBtn").addEventListener("click", () => {
    if (!currentRoomKey || !allRooms[currentRoomKey]) return;
    const r = allRooms[currentRoomKey];
    const ap = getActiveAp(r);
    const text = `📍 ${r.name} (${r.floor || "MITM"})\nFrom ${ap.name}: ${ap.info || r.info || "Follow walkthrough photos"}`;
    navigator.clipboard.writeText(text).then(() => showToast("Route instructions copied"));
  });

  document.getElementById("shareRouteBtn").addEventListener("click", () => {
    if (!currentRoomKey) return;
    const url = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(currentRoomKey);
    navigator.clipboard.writeText(url).then(() => showToast("Shareable link copied"));
  });

  // Keyboard navigation
  window.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    } else if (e.key === "Escape") {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        searchInput.blur();
      }
    } else if (document.activeElement.tagName !== "INPUT") {
      if (e.key === "ArrowLeft") prevPhoto();
      else if (e.key === "ArrowRight") nextPhoto();
      else if (e.key === " ") {
        e.preventDefault();
        toggleAutoPilot();
      } else if (e.key.toLowerCase() === "f") {
        toggleFullscreen();
      }
    }
  });

  // Touch Swipe on Canvas
  let touchStartX = 0;
  const canvas = document.getElementById("viewportCanvas");
  canvas.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    const diff = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(diff) > 40) {
      if (diff > 0) prevPhoto();
      else nextPhoto();
    }
  }, { passive: true });

  window.addEventListener("popstate", (e) => {
    if (e.state && e.state.room && allRooms[e.state.room]) {
      selectRoom(e.state.room, false);
    }
  });
}

// Render Directory List
function renderDirectoryList() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const dirView = document.getElementById("directoryView");
  dirView.innerHTML = "";

  const keys = Object.keys(allRooms).sort((a, b) => {
    const numA = parseInt(a, 10);
    const numB = parseInt(b, 10);
    if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
    return a.localeCompare(b);
  });

  const filtered = keys.filter(k => {
    const r = allRooms[k];
    const matchQuery = !query ||
      k.toLowerCase().includes(query) ||
      (r.info && r.info.toLowerCase().includes(query)) ||
      (r.dept && r.dept.toLowerCase().includes(query)) ||
      (r.accessPoints && r.accessPoints.some(ap => ap.name.toLowerCase().includes(query) || (ap.info && ap.info.toLowerCase().includes(query))));

    const matchFloor = activeFloor === "all" || r.floor === activeFloor;
    return matchQuery && matchFloor;
  });

  if (filtered.length === 0) {
    dirView.innerHTML = `<div style="padding: 32px 14px; text-align: center; color: var(--text-muted); font-size: 13px;">No destinations match "${query}".</div>`;
    return;
  }

  filtered.forEach(key => {
    const r = allRooms[key];
    const totalPhotos = (r.photos ? r.photos.length : 0) + (r.accessPoints ? r.accessPoints.reduce((acc, ap) => acc + (ap.photos ? ap.photos.length : 0), 0) : 0);
    const isCurrent = (currentRoomKey === key);

    const item = document.createElement("div");
    item.className = "dest-item" + (isCurrent ? " active" : "");
    item.innerHTML = `
      <div class="dest-info-left">
        <div class="dest-icon-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="dest-texts">
          <div class="dest-name">${r.name}</div>
          <div class="dest-meta">${r.dept || `${totalPhotos} Photos`}</div>
        </div>
      </div>
      <span class="dest-floor-badge">${r.floor || "MITM"}</span>
    `;

    item.addEventListener("click", () => selectRoom(key, true));
    dirView.appendChild(item);
  });
}

// Select Room
function selectRoom(key, updateUrl = true) {
  const room = allRooms[key];
  if (!room) return;

  currentRoomKey = key;
  currentApIndex = 0;
  currentPhotoIndex = 0;
  stopAutoPilot();

  if (updateUrl) {
    window.history.pushState({ room: key }, "", `?room=${encodeURIComponent(key)}`);
  }

  // Update HUD
  document.getElementById("hudRoomName").textContent = room.name;

  // Show Route Panel in Sidebar
  showRoutePanel(room);

  // Load photos for active AP
  loadActiveRoutePhotos();

  // Mark active in directory list
  document.querySelectorAll(".dest-item").forEach(item => {
    const nameEl = item.querySelector(".dest-name");
    if (nameEl && nameEl.textContent === key) {
      item.classList.add("active");
    } else {
      item.classList.remove("active");
    }
  });
}

function getActiveAp(room) {
  if (room.accessPoints && room.accessPoints.length > 0) {
    return room.accessPoints[currentApIndex] || room.accessPoints[0];
  }
  return {
    name: "Main Access Point",
    info: room.info || "Follow corridor walkthrough.",
    thumbnail: room.thumbnail || "",
    photos: room.photos || []
  };
}

// Show Route Panel
function showRoutePanel(room) {
  document.getElementById("directoryView").style.display = "none";
  const panel = document.getElementById("routePanel");
  panel.style.display = "block";

  document.getElementById("panelDestName").textContent = room.name;
  document.getElementById("panelDestDept").textContent = room.dept || "Campus Destination";
  document.getElementById("panelDestFloor").textContent = room.floor || "MITM";

  // Starting Point Tabs
  const points = (room.accessPoints && room.accessPoints.length > 0) ? room.accessPoints : [];
  const apBlock = document.getElementById("apBlock");
  const apTabsRow = document.getElementById("apTabsRow");
  apTabsRow.innerHTML = "";

  if (points.length <= 1) {
    apBlock.style.display = "none";
  } else {
    apBlock.style.display = "block";
    points.forEach((ap, idx) => {
      const tab = document.createElement("button");
      tab.className = "ap-seg-tab" + (idx === currentApIndex ? " active" : "");
      tab.textContent = ap.name;
      tab.title = ap.name;
      tab.addEventListener("click", () => {
        document.querySelectorAll(".ap-seg-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentApIndex = idx;
        currentPhotoIndex = 0;
        loadActiveRoutePhotos();
      });
      apTabsRow.appendChild(tab);
    });
  }

  updateRouteNotesAndChecklist();
}

function updateRouteNotesAndChecklist() {
  const room = allRooms[currentRoomKey];
  const ap = getActiveAp(room);

  document.getElementById("panelDirTitle").innerHTML = `
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
    <span>Route from ${ap.name}</span>
  `;
  document.getElementById("panelDirText").textContent = ap.info || room.info || "Follow photo sequence to destination.";
  document.getElementById("panelPhotosCount").textContent = `${ap.photos ? ap.photos.length : 0} Photos`;

  // Build Waypoint Checklist
  const checklist = document.getElementById("stepChecklist");
  checklist.innerHTML = "";

  const photos = ap.photos || [];
  photos.forEach((_, idx) => {
    const row = document.createElement("div");
    row.className = "step-row" + (idx === currentPhotoIndex ? " active" : "");
    row.innerHTML = `
      <div class="step-num-circle">${idx + 1}</div>
      <div style="flex:1;">Waypoint ${idx + 1}</div>
    `;
    row.addEventListener("click", () => {
      currentPhotoIndex = idx;
      renderActivePhoto();
    });
    checklist.appendChild(row);
  });
}

function showDirectoryMode() {
  stopAutoPilot();
  document.getElementById("routePanel").style.display = "none";
  document.getElementById("directoryView").style.display = "block";
}

// Load Active Photos
function loadActiveRoutePhotos() {
  const room = allRooms[currentRoomKey];
  if (!room) return;
  const ap = getActiveAp(room);
  currentPhotos = ap.photos || [];
  buildTimelineScrubber();
  renderActivePhoto();
  updateRouteNotesAndChecklist();
}

// Render Active Photo on Canvas
function renderActivePhoto() {
  const stage = document.getElementById("mediaStage");
  const counter = document.getElementById("hudStepCounter");

  if (!currentPhotos || currentPhotos.length === 0) {
    stage.innerHTML = `<div style="color:var(--text-muted); font-size:13px;">No walkthrough media uploaded for this destination.</div>`;
    counter.textContent = "0 of 0";
    return;
  }

  counter.textContent = `Waypoint ${currentPhotoIndex + 1} of ${currentPhotos.length}`;

  const currentPath = currentPhotos[currentPhotoIndex];
  const url = resolveUrl(currentPath);
  const isVideo = /\.(mp4|webm)$/i.test(currentPath);

  if (isVideo) {
    stage.innerHTML = `<video src="${url}" controls playsinline preload="auto"></video>`;
  } else {
    stage.innerHTML = `<img src="${url}" alt="Waypoint ${currentPhotoIndex + 1}" loading="eager" onerror="this.onerror=null; this.src='logo.svg';">`;
  }

  // Update Timeline Scrubber
  document.querySelectorAll(".timeline-segment").forEach((seg, idx) => {
    seg.classList.toggle("active", idx === currentPhotoIndex);
    seg.classList.toggle("past", idx < currentPhotoIndex);
  });

  // Update Checklist
  document.querySelectorAll(".step-row").forEach((row, idx) => {
    row.classList.toggle("active", idx === currentPhotoIndex);
  });

  // Preload adjacent images
  preloadAdjacent();
}

function preloadAdjacent() {
  if (currentPhotos.length <= 1) return;
  const next = (currentPhotoIndex + 1) % currentPhotos.length;
  const prev = (currentPhotoIndex - 1 + currentPhotos.length) % currentPhotos.length;

  [next, prev].forEach(idx => {
    const p = currentPhotos[idx];
    if (p && !/\.(mp4|webm)$/i.test(p)) {
      const u = resolveUrl(p);
      if (!preloadedUrls.has(u)) {
        const img = new Image();
        img.src = u;
        preloadedUrls.add(u);
      }
    }
  });
}

// Timeline Scrubber
function buildTimelineScrubber() {
  const track = document.getElementById("timelineTrack");
  track.innerHTML = "";

  if (currentPhotos.length <= 1) {
    track.style.display = "none";
    return;
  }
  track.style.display = "flex";

  currentPhotos.forEach((_, idx) => {
    const seg = document.createElement("div");
    seg.className = "timeline-segment" + (idx === currentPhotoIndex ? " active" : "");
    seg.title = `Waypoint ${idx + 1}`;
    seg.addEventListener("click", () => {
      currentPhotoIndex = idx;
      renderActivePhoto();
    });
    track.appendChild(seg);
  });
}

function nextPhoto() {
  if (currentPhotos.length === 0) return;
  currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotos.length;
  renderActivePhoto();
}

function prevPhoto() {
  if (currentPhotos.length === 0) return;
  currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotos.length) % currentPhotos.length;
  renderActivePhoto();
}

// Auto-Pilot Tour
function toggleAutoPilot() {
  if (isAutoPilot) stopAutoPilot();
  else startAutoPilot();
}

function startAutoPilot() {
  if (currentPhotos.length <= 1) return;
  isAutoPilot = true;
  const btn = document.getElementById("deckTourBtn");
  btn.classList.add("playing");
  document.getElementById("deckTourLabel").textContent = "Pause";
  showToast("Auto-pilot tour started");

  autoPilotTimer = setInterval(() => {
    nextPhoto();
  }, 2200);
}

function stopAutoPilot() {
  isAutoPilot = false;
  if (autoPilotTimer) clearInterval(autoPilotTimer);
  autoPilotTimer = null;
  const btn = document.getElementById("deckTourBtn");
  if (btn) {
    btn.classList.remove("playing");
    document.getElementById("deckTourLabel").textContent = "Auto-Pilot";
  }
}

// Fullscreen
function toggleFullscreen() {
  const viewport = document.getElementById("viewportCanvas");
  if (!document.fullscreenElement) {
    viewport.requestFullscreen().catch(() => showToast("Fullscreen unavailable"));
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener("DOMContentLoaded", initApp);
</script>
