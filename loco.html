<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔍 Room [MITM] - Locorom</title>
<link rel="icon" href="https://raw.githubusercontent.com/2005lakshmi/locorom/main/logo_locorom.png">
<link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff; color: #262730; padding: 16px; max-width: 900px; margin: 0 auto;
    }
    .logo-container { display: flex; align-items: center; justify-content: space-between; }
    .room-title { font-size: 24px; font-weight: bold; }
    .room-code { color: green; font-size: 15px; }
    .logo img { width: 68px; height: 68px; }
    hr { border: none; border-top: 1px solid gray; margin: 10px 0; }
    input#search {
        width: 100%; padding: 10px 14px; font-size: 16px;
        border: 1px solid #ccc; border-radius: 8px; outline: none;
    }
    input#search:focus { border-color: #0d92f4; }
    .room-radio { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
    .room-radio label { cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .room-radio label:hover { background: #f0f2f6; }
    h2.room-head { margin: 12px 0; }
    h2.room-head span { color: #ff4b4b; }
    h4.from-point { color: green; margin: 18px 0 8px; }
    h5.loc-info-head { color: #0d92f4; margin-bottom: 4px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    .row .thumb { flex: 0 0 200px; }
    .row .thumb img { width: 200px; border-radius: 8px; }
    .row .info { flex: 1; min-width: 220px; }
    .info-text { font-size: 15px; white-space: pre-wrap; }
    .swiper { width: 100%; margin: 10px 0 20px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; }
    .swiper-slide img, .swiper-slide video {
        max-height: 400px; width: 100%; object-fit: contain;
        border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .swiper-pagination-fraction {
        font-size: 16px; font-weight: bold; color: white; text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }
    .divider { border-top: 1px solid gray; margin: 16px 0; }
    .no-media { background: #eaf4ff; color: #0d92f4; padding: 10px 14px; border-radius: 8px; margin: 10px 0; }
    @media (max-width: 600px) {
        .swiper-slide img, .swiper-slide video { max-height: 300px; }
        .row .thumb { flex: 0 0 140px; }
        .row .thumb img { width: 140px; }
    }
</style>
</head>
<body>

<div class="logo-container">
    <h1 class="room-title">🔍 Room <span class="room-code">[MITM]</span></h1>
    <div class="logo"><img src="https://raw.githubusercontent.com/2005lakshmi/locorom/main/logo_locorom.png" alt="Logo"></div>
</div>

<hr>
<input type="text" id="search" placeholder="example., 415B" autocomplete="off">
<div class="room-radio" id="roomList"></div>
<hr>

<div id="content"></div>

<script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
<script>
const REPO_USER = "2005lakshmi";
const REPO_NAME = "locorom";
const BASE_PATH = "Rooms";
// Free CDN - no GitHub API tokens needed
const TREE_URL = `https://data.jsdelivr.com/v1/packages/gh/REPOUSER/{REPO_USER}/REPOU​SER/{REPO_NAME}@main?structure=flat`;
const RAW = f => `https://cdn.jsdelivr.net/gh/REPOUSER/{REPO_USER}/REPOU​SER/{REPO_NAME}@main/${f}`;
const MEDIA_EXT = ["jpg","jpeg","png","gif","mp4"];

let allRoomFiles = [];   // all file paths under Rooms/
let rooms = [];
let selectedRoom = null;

async function loadTree() {
    const resp = await fetch(TREE_URL);
    if (!resp.ok) { document.getElementById("content").innerHTML = "<p>Failed to load room data.</p>"; return; }
    const data = await resp.json();
    allRoomFiles = data.files.map(f => f.name).filter(n => n.startsWith(BASE_PATH + "/"));
    // rooms = first-level directories under Rooms/
    const roomSet = new Set();
    allRoomFiles.forEach(p => {
        const rest = p.slice(BASE_PATH.length + 1);
        const room = rest.split("/")[0];
        if (room) roomSet.add(room);
    });
    rooms = [...roomSet].sort();
    renderRoomList();
}

function renderRoomList() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const list = q ? rooms.filter(r => r.toLowerCase().includes(q)) : rooms;
    const el = document.getElementById("roomList");
    el.innerHTML = "";
    if (q && list.length === 0) {
        el.innerHTML = "<p style='color:red'>No rooms found</p>";
        document.getElementById("content").innerHTML = "";
        return;
    }
    if (!q) {
        el.innerHTML = "<p style='color:#888'>Please enter room number to search..!</p>";
        document.getElementById("content").innerHTML = "";
        return;
    }
    list.forEach(r => {
        const lbl = document.createElement("label");
        lbl.innerHTML = `<input type="radio" name="room" value="r"{r}"r"{r===selectedRoom?"checked":""}> ${r}`;
        lbl.querySelector("input").addEventListener("change", () => { selectedRoom = r; showRoom(r); });
        el.appendChild(lbl);
    });
}

function filesUnder(prefix) {
    return allRoomFiles
        .filter(p => p.startsWith(prefix + "/"))
        .map(p => p.slice(prefix.length + 1))
        .filter(n => n && !n.includes("/"));
}
function dirsUnder(prefix) {
    const set = new Set();
    allRoomFiles.filter(p => p.startsWith(prefix + "/")).forEach(p => {
        const rest = p.slice(prefix.length + 1);
        if (rest.includes("/")) set.add(rest.split("/")[0]);
    });
    return [...set];
}
const isMedia = n => MEDIA_EXT.includes(n.split(".").pop().toLowerCase());

async function fetchText(path) {
    try {
        const resp = await fetch(RAW(path));
        return resp.ok ? await resp.text() : "";
    } catch { return ""; }
}

function carouselHTML(files) {
    if (!files.length) return "";
    const slides = files.map(f => {
        const url = RAW(f);
        const ext = f.split(".").pop().toLowerCase();
        const inner = ext === "mp4"
            ? `<video controls><source src="${url}" type="video/mp4"></video>`
            : `<img src="${url}" loading="lazy">`;
        return `<div class="swiper-slide">${inner}</div>`;
    }).join("");
    const id = "sw" + Math.random().toString(36).slice(2);
    setTimeout(() => {
        new Swiper("." + id, {
            loop: true,
            pagination: { el: "." + id + " .swiper-pagination", type: "fraction" },
            navigation: { nextEl: "." + id + " .swiper-button-next", prevEl: "." + id + " .swiper-button-prev" },
        });
    }, 0);
    return `
    <div class="swiper ${id}">
        <div class="swiper-wrapper">${slides}</div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>`;
}

function mediaRow(thumbURL, info, files, heading) {
    return `
    <h4 class="from-point">From Point:</h4>
    <div class="row">
        <div class="thumb"><img src="${thumbURL}" loading="lazy"></div>
        <div class="info">
            <h5 class="loc-info-head">Location Info :</h5>
            <div class="info-text">${info || "No information available"}</div>
        </div>
    </div>
    {files.length ? `<h5>Photos</h5><p style="font-size:13px;color:#666">Path through Photos</p>{carouselHTML(files)}`
                   : `<div class="no-media">No media available</div>`}
    <div class="divider"></div>`;
}

async function showRoom(room) {
    const content = document.getElementById("content");
    content.innerHTML = `<h2 class="room-head">Room: <span>${room}</span></h2><p>Loading…</p>`;

    const roomPrefix = `BASEPATH/{BASE_PATH}/BASEP​ATH/{room}`;
    const roomInfo = await fetchText(`${roomPrefix}/info.txt`);

    // Main area media (files directly in room folder, excluding info.txt)
    const mainMedia = filesUnder(roomPrefix)
        .filter(n => isMedia(n))
        .sort();
    const mainThumb = mainMedia.length ? RAW(mainMedia[0]) : "";

    let html = `<h2 class="room-head">Room: <span>${room}</span></h2>`;
    if (mainMedia.length) {
        html += mediaRow(mainThumb, roomInfo, mainMedia.map(n => `roomPrefix/{roomPrefix}/roomPrefix/{n}`));
    }

    // Subfolders
    const subs = dirsUnder(roomPrefix).sort();
    for (const sub of subs) {
        const subPrefix = `roomPrefix/{roomPrefix}/roomPrefix/{sub}`;
        const info = await fetchText(`${subPrefix}/info.txt`);
        const media = filesUnder(subPrefix).filter(n => isMedia(n) && n.toLowerCase() !== "thumbnail.jpg").sort();
        const thumbURL = RAW(`${subPrefix}/thumbnail.jpg`);
        html += mediaRow(thumbURL, info, media.map(n => `subPrefix/{subPrefix}/subPrefix/{n}`));
    }

    content.innerHTML = html;
}

document.getElementById("search").addEventListener("input", () => {
    selectedRoom = null;
    document.getElementById("content").innerHTML = "";
    renderRoomList();
});

loadTree();
</script>
</body>
</html>
